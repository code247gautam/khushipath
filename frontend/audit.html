<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Audit Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body{background:#f0f4f8}
    .sidebar{width:220px;min-height:100vh;background:#1e293b;color:#cbd5e1;position:fixed;top:0;left:0;display:flex;flex-direction:column}
    .sidebar .brand{padding:.6rem 1rem .6rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155}
    .sidebar .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .sidebar .brand span{font-size:1rem;font-weight:700;color:#fff;line-height:1.2}
    .sidebar nav a{display:block;padding:.55rem 1rem;color:#94a3b8;text-decoration:none;font-size:.9rem}
    .sidebar nav a:hover,.sidebar nav a.active{background:#334155;color:#fff}
    .main-content{margin-left:220px;padding:2rem}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
    code{font-size:.8rem}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/patients.html"><i data-lucide="users"></i> Patients</a>
    <a href="/orders.html"><i data-lucide="clipboard-list"></i> Orders</a>
    <a href="/results.html"><i data-lucide="microscope"></i> Results</a>
    <a href="/approval.html"><i data-lucide="check-circle"></i> Approval</a>
    <a href="/reports.html"><i data-lucide="file-text"></i> Reports</a>
    <a href="/audit.html" class="active"><i data-lucide="search"></i> Audit Log</a>
    <a href="/retention.html"><i data-lucide="archive"></i> Retention</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html"><i data-lucide="user"></i> Users</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">Audit Log</h4>
    <div class="d-flex gap-2">
      <a id="exportBtn" href="#" class="btn btn-sm btn-outline-secondary">⬇ Export CSV</a>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" id="actionFilter" class="form-control form-control-sm" placeholder="Action (e.g. auth.login)" />
        </div>
        <div class="col-md-2">
          <input type="text" id="userFilter" class="form-control form-control-sm" placeholder="User email" />
        </div>
        <div class="col-md-2">
          <input type="date" id="dateFrom" class="form-control form-control-sm" />
        </div>
        <div class="col-md-2">
          <input type="date" id="dateTo" class="form-control form-control-sm" />
        </div>
        <div class="col-auto">
          <button class="btn btn-primary btn-sm" id="searchBtn">Search</button>
          <button class="btn btn-outline-secondary btn-sm ms-1" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover table-sm mb-0" style="font-size:.82rem">
        <thead class="table-light">
          <tr>
            <th>Time</th><th>Action</th><th>Entity</th>
            <th>User</th><th>Role</th><th>Branch</th><th>IP</th><th>Detail</th>
          </tr>
        </thead>
        <tbody id="auditTbody">
          <tr><td colspan="8" class="text-center text-muted py-4">Use filters above to search the audit log.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center small text-muted">
      <span id="totalLabel"></span>
      <div class="d-flex gap-2">
        <button class="btn btn-xs btn-sm btn-outline-secondary" id="prevBtn" disabled>‹ Prev</button>
        <span id="pageLabel">Page 1</span>
        <button class="btn btn-xs btn-sm btn-outline-secondary" id="nextBtn">Next ›</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/audit.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
