<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Login</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { background: #f0f4f8; }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .lab-brand { color: #1e293b; font-weight: 700; letter-spacing: .3px; }
    .lab-logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <img src="assets/logo.png" alt="Khushi Pathological Lab" class="lab-logo mb-3" />
      <h3 class="lab-brand">Khushi Pathological Lab</h3>
      <p class="text-muted small">Staff portal — authorised access only</p>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email" id="email" name="email"
          class="form-control" autocomplete="username" required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password" id="password" name="password"
          class="form-control" autocomplete="current-password" required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100" id="loginBtn">
        Sign in
      </button>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
