<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Packages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body { background:#f0f4f8; }
    .sidebar { width:220px;min-height:100vh;background:#1e293b;color:#cbd5e1;position:fixed;top:0;left:0;display:flex;flex-direction:column; }
    .sidebar .brand { padding:.6rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155; }
    .sidebar .brand img { width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0; }
    .sidebar .brand span { font-size:1rem;font-weight:700;color:#fff;line-height:1.2; }
    .sidebar nav a { display:block;padding:.55rem 1rem;color:#94a3b8;text-decoration:none;font-size:.9rem; }
    .sidebar nav a:hover,.sidebar nav a.active { background:#334155;color:#fff; }
    .main-content { margin-left:220px;padding:2rem; }
    .topbar { display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html"><i data-lucide="user"></i> Users</a>
    <a href="/tests.html"><i data-lucide="flask-conical"></i> Test Catalog</a>
    <a href="/packages.html" class="active"><i data-lucide="package"></i> Packages</a>
    <a href="/import.html"><i data-lucide="upload"></i> Import</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">Test Packages</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-sm" id="addPkgBtn" data-bs-toggle="modal" data-bs-target="#pkgModal">+ New Package</button>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0 small">
        <thead class="table-light">
          <tr>
            <th>Code</th><th>Name</th><th>Price</th><th>Tests</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="pkgTbody">
          <tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Package modal -->
<div class="modal fade" id="pkgModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="pkgModalTitle">New Package</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalAlert" class="alert d-none"></div>
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label class="form-label">Code *</label>
            <input type="hidden" id="pkgId" />
            <input type="text" id="pkgCode" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Name *</label>
            <input type="text" id="pkgName" class="form-control" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Price</label>
            <input type="number" id="pkgPrice" class="form-control" value="0" min="0" step="0.01" />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea id="pkgDesc" class="form-control" rows="2"></textarea>
          </div>
        </div>

        <!-- Tests in package -->
        <div id="pkgTestsSection" class="d-none">
          <h6 class="fw-semibold">Tests in this package</h6>
          <ul id="pkgTestList" class="list-group list-group-flush mb-2"></ul>
          <div class="d-flex gap-2 mt-2">
            <select id="addTestSel" class="form-select form-select-sm" style="max-width:280px">
              <option value="">— add a test —</option>
            </select>
            <button class="btn btn-sm btn-outline-primary" id="addTestToPkgBtn">Add</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="savePkgBtn">Save Package</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/packages.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
