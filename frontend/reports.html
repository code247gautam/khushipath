<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body{background:#f0f4f8}
    .sidebar{width:220px;min-height:100vh;background:#1e293b;color:#cbd5e1;position:fixed;top:0;left:0;display:flex;flex-direction:column}
    .sidebar .brand{padding:.6rem 1rem .6rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155}
    .sidebar .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .sidebar .brand span{font-size:1rem;font-weight:700;color:#fff;line-height:1.2}
    .sidebar nav a{display:block;padding:.55rem 1rem;color:#94a3b8;text-decoration:none;font-size:.9rem}
    .sidebar nav a:hover,.sidebar nav a.active{background:#334155;color:#fff}
    .main-content{margin-left:220px;padding:2rem}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
    .superseded{opacity:.55;text-decoration:line-through}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/patients.html"><i data-lucide="users"></i> Patients</a>
    <a href="/orders.html"><i data-lucide="clipboard-list"></i> Orders</a>
    <a href="/results.html"><i data-lucide="microscope"></i> Results</a>
    <a href="/approval.html"><i data-lucide="check-circle"></i> Approval</a>
    <a href="/reports.html" class="active"><i data-lucide="file-text"></i> Reports</a>
    <a href="/tests.html"><i data-lucide="flask-conical"></i> Test Catalog</a>
    <a href="/packages.html"><i data-lucide="package"></i> Packages</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html"><i data-lucide="user"></i> Users</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">Report Search &amp; History</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <!-- Search filters -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="search" id="searchInput" class="form-control form-control-sm" placeholder="Name / Patient ID / Report No…" />
        </div>
        <div class="col-md-2">
          <input type="date" id="dateFrom" class="form-control form-control-sm" />
        </div>
        <div class="col-md-2">
          <input type="date" id="dateTo" class="form-control form-control-sm" />
        </div>
        <div class="col-md-2">
          <input type="text" id="testCode" class="form-control form-control-sm" placeholder="Test code (e.g. HGB)" />
        </div>
        <div class="col-md-2">
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="">All statuses</option>
            <option value="approved">Approved</option>
            <option value="superseded">Superseded</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary btn-sm" id="searchBtn">Search</button>
          <button class="btn btn-outline-secondary btn-sm ms-1" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0 small">
        <thead class="table-light">
          <tr>
            <th>Report No.</th><th>Patient</th><th>Order No.</th>
            <th>Pathologist</th><th>Date</th><th>Ver.</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportTbody">
          <tr><td colspan="8" class="text-center text-muted py-4">Use the search bar above to find reports.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/reports.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
