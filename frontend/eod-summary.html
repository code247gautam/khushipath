<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — EOD Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body{background:#f0f4f8}
    .sidebar{width:220px;min-height:100vh;background:#1e293b;color:#cbd5e1;position:fixed;top:0;left:0;display:flex;flex-direction:column}
    .sidebar .brand{padding:.6rem 1rem .6rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155}
    .sidebar .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .sidebar .brand span{font-size:1rem;font-weight:700;color:#fff;line-height:1.2}
    .sidebar nav a{display:block;padding:.55rem 1rem;color:#94a3b8;text-decoration:none;font-size:.9rem}
    .sidebar nav a:hover,.sidebar nav a.active{background:#334155;color:#fff}
    .main-content{margin-left:220px;padding:2rem}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
    .kpi-box{background:#fff;border-radius:8px;padding:1rem;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07)}
    .kpi-box .num{font-size:1.8rem;font-weight:700;color:#1e293b}
    .kpi-box .lbl{font-size:.75rem;color:#64748b}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/patients.html"><i data-lucide="users"></i> Patients</a>
    <a href="/orders.html"><i data-lucide="clipboard-list"></i> Orders</a>
    <a href="/results.html"><i data-lucide="microscope"></i> Results</a>
    <a href="/approval.html"><i data-lucide="check-circle"></i> Approval</a>
    <a href="/reports.html"><i data-lucide="file-text"></i> Reports</a>
    <a href="/eod-summary.html" class="active"><i data-lucide="bar-chart-2"></i> EOD Summary</a>
    <a href="/audit.html"><i data-lucide="search"></i> Audit Log</a>
    <a href="/retention.html"><i data-lucide="archive"></i> Retention</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html"><i data-lucide="user"></i> Users</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">End-of-Day Summary</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small">Date</label>
          <input type="date" id="eodDate" class="form-control form-control-sm" />
        </div>
        <div class="col-md-3" id="branchSelectWrap">
          <label class="form-label small">Branch</label>
          <select id="branchSelect" class="form-select form-select-sm">
            <option value="">All Branches</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary btn-sm" id="loadBtn">Load</button>
        </div>
        <div class="col-auto" id="exportBtns" style="display:none">
          <a id="pdfBtn"   href="#" class="btn btn-sm btn-outline-secondary">⬇ PDF</a>
          <a id="excelBtn" href="#" class="btn btn-sm btn-outline-secondary ms-1">⬇ CSV</a>
        </div>
      </div>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>
  <div id="summaryContent" style="display:none">

    <!-- KPI row -->
    <div class="row g-2 mb-3" id="eodKpis"></div>

    <!-- Status breakdown -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-header small fw-semibold">Order Status Breakdown</div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0">
              <tbody id="statusTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card h-100">
          <div class="card-header small fw-semibold"><i data-lucide="trophy"></i> Top Tests</div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0">
              <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Count</th></tr></thead>
              <tbody id="topTestsTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Orders table -->
    <div class="card mb-3">
      <div class="card-header small fw-semibold">All Orders</div>
      <div class="card-body p-0">
        <table class="table table-sm table-hover mb-0 small">
          <thead class="table-light">
            <tr><th>Order No.</th><th>Patient</th><th>Status</th><th>Value (₹)</th><th>Time</th></tr>
          </thead>
          <tbody id="eodOrdersTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Approved reports -->
    <div class="card">
      <div class="card-header small fw-semibold">Approved Reports</div>
      <div class="card-body p-0">
        <table class="table table-sm table-hover mb-0 small">
          <thead class="table-light">
            <tr><th>Report No.</th><th>Order</th><th>Pathologist</th><th>Approved At</th></tr>
          </thead>
          <tbody id="eodReportsTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/eod-summary.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
