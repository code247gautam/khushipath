<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Test Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body { background:#f0f4f8; }
    .sidebar { width:220px;min-height:100vh;background:#1e293b;color:#cbd5e1;position:fixed;top:0;left:0;display:flex;flex-direction:column; }
    .sidebar .brand { padding:.6rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155; }
    .sidebar .brand img { width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0; }
    .sidebar .brand span { font-size:1rem;font-weight:700;color:#fff;line-height:1.2; }
    .sidebar nav a { display:block;padding:.55rem 1rem;color:#94a3b8;text-decoration:none;font-size:.9rem; }
    .sidebar nav a:hover,.sidebar nav a.active { background:#334155;color:#fff; }
    .main-content { margin-left:220px;padding:2rem; }
    .topbar { display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem; }
    .flag-H { color:#dc3545;font-weight:600; }
    .flag-L { color:#0d6efd;font-weight:600; }
    .flag-N { color:#198754; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html"><i data-lucide="user"></i> Users</a>
    <a href="/tests.html" class="active"><i data-lucide="flask-conical"></i> Test Catalog</a>
    <a href="/packages.html"><i data-lucide="package"></i> Packages</a>
    <a href="/import.html"><i data-lucide="upload"></i> Import</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">Test Catalog</h4>
    <div class="d-flex gap-2">
      <input type="search" id="searchInput" class="form-control form-control-sm" placeholder="Search code or name…" style="width:200px" />
      <select id="catFilter" class="form-select form-select-sm" style="width:170px">
        <option value="">All categories</option>
      </select>
      <button class="btn btn-primary btn-sm" id="addTestBtn" data-bs-toggle="modal" data-bs-target="#testModal">+ New Test</button>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0 small">
        <thead class="table-light">
          <tr>
            <th>Code</th><th>Name</th><th>Category</th>
            <th>Unit</th><th>Price</th><th>Sample</th><th>TAT (h)</th>
            <th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="testTbody">
          <tr><td colspan="9" class="text-center text-muted py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Test modal -->
<div class="modal fade" id="testModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="testModalTitle">New Test</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalAlert" class="alert d-none"></div>
        <form id="testForm" novalidate>
          <input type="hidden" id="testId" />
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Code *</label>
              <input type="text" id="tCode" class="form-control" required />
            </div>
            <div class="col-md-9">
              <label class="form-label">Name *</label>
              <input type="text" id="tName" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Category</label>
              <select id="tCategory" class="form-select">
                <option value="">— none —</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Unit</label>
              <input type="text" id="tUnit" class="form-control" placeholder="g/dL" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Price</label>
              <input type="number" id="tPrice" class="form-control" value="0" min="0" step="0.01" />
            </div>
            <div class="col-md-3">
              <label class="form-label">TAT (hours)</label>
              <input type="number" id="tTAT" class="form-control" value="24" min="1" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Sample Type</label>
              <input type="text" id="tSample" class="form-control" placeholder="EDTA Blood" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Method</label>
              <input type="text" id="tMethod" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea id="tNotes" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </form>

        <!-- Reference ranges sub-section (shown when editing) -->
        <div id="rangesSection" class="d-none mt-4">
          <h6 class="fw-semibold">Reference Ranges</h6>
          <table class="table table-sm table-bordered" id="rangeTable">
            <thead class="table-light">
              <tr>
                <th>Age min</th><th>Age max</th><th>Gender</th>
                <th>Low</th><th>High</th><th>Text</th><th></th>
              </tr>
            </thead>
            <tbody id="rangeTbody"></tbody>
          </table>
          <button class="btn btn-sm btn-outline-secondary" id="addRangeBtn">+ Add Range</button>
          <!-- Inline range form -->
          <div id="rangeForm" class="d-none mt-2 p-3 border rounded bg-light">
            <div class="row g-2">
              <div class="col-2"><label class="form-label small">Age min</label><input type="number" id="rAgeMin" class="form-control form-control-sm" /></div>
              <div class="col-2"><label class="form-label small">Age max</label><input type="number" id="rAgeMax" class="form-control form-control-sm" /></div>
              <div class="col-2">
                <label class="form-label small">Gender</label>
                <select id="rGender" class="form-select form-select-sm">
                  <option value="">Both</option>
                  <option value="M">Male</option>
                  <option value="F">Female</option>
                </select>
              </div>
              <div class="col-2"><label class="form-label small">Low</label><input type="number" step="any" id="rLow" class="form-control form-control-sm" /></div>
              <div class="col-2"><label class="form-label small">High</label><input type="number" step="any" id="rHigh" class="form-control form-control-sm" /></div>
              <div class="col-6"><label class="form-label small">Text (override)</label><input type="text" id="rText" class="form-control form-control-sm" placeholder="e.g. Negative" /></div>
              <div class="col-6 d-flex align-items-end gap-2">
                <button class="btn btn-sm btn-primary" id="saveRangeBtn">Save</button>
                <button class="btn btn-sm btn-secondary" id="cancelRangeBtn">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="saveTestBtn">Save Test</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/tests.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
