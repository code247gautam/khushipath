<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PathLab — Users</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .lucide { width: 16px; height: 16px; vertical-align: -2px; }
    body { background: #f0f4f8; }
    .sidebar {
      width: 220px; min-height: 100vh;
      background: #1e293b; color: #cbd5e1;
      position: fixed; top: 0; left: 0;
      display: flex; flex-direction: column;
    }
    .sidebar .brand { padding: .6rem 1rem; display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid #334155; }
    .sidebar .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .sidebar .brand span { font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .sidebar nav a { display: block; padding: .55rem 1rem; color: #94a3b8; text-decoration: none; font-size: .9rem; }
    .sidebar nav a:hover, .sidebar nav a.active { background: #334155; color: #fff; }
    .main-content { margin-left: 220px; padding: 2rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo.png" alt="Khushi Pathological Lab logo" />
    <span>Khushi<br>Path Lab</span>
  </div>
  <nav class="mt-2">
    <a href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="/branches.html"><i data-lucide="building-2"></i> Branches</a>
    <a href="/users.html" class="active"><i data-lucide="user"></i> Users</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <h4 class="mb-0">Users</h4>
    <div class="d-flex gap-2 align-items-center">
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal" id="addUserBtn">
        + New User
      </button>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-3"></div>

  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th><th>Name</th><th>Email</th><th>Role</th>
            <th>Branch</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTbody">
          <tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- User modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalAlert" class="alert d-none"></div>
        <form id="userForm" novalidate>
          <input type="hidden" id="userId" />
          <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" id="userName" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" id="userEmail" class="form-control" required />
          </div>
          <div class="mb-3" id="passwordGroup">
            <label class="form-label">Password * (min 8 chars)</label>
            <input type="password" id="userPassword" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Role *</label>
            <select id="userRole" class="form-select">
              <option value="receptionist">Receptionist</option>
              <option value="technician">Technician</option>
              <option value="pathologist">Pathologist</option>
              <option value="accountant">Accountant</option>
              <option value="branch_manager">Branch Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-3" id="branchGroup">
            <label class="form-label">Branch *</label>
            <select id="userBranch" class="form-select">
              <option value="">— select branch —</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" id="userPhone" class="form-control" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveUserBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/users.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
